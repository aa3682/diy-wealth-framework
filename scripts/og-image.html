<!doctype html>
<!--
  Source for public/og.png, the 1200x630 link-preview image.
  To regenerate after editing, screenshot this page at exactly
  1200x630 (for example with Playwright's page.screenshot) and save the
  result over public/og.png.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Outfit', system-ui, sans-serif;
    background:
      radial-gradient(900px 500px at 100% 0%, rgba(59, 130, 246, 0.16), transparent 60%),
      radial-gradient(700px 500px at 0% 100%, rgba(16, 185, 129, 0.16), transparent 60%),
      #0f172a;
    color: #f8fafc;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
  }
  .eyebrow { font-size: 26px; font-weight: 600; color: #6ee7b7; letter-spacing: 0.04em; }
  h1 {
    margin-top: 18px;
    font-size: 104px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(90deg, #10b981, #3b82f6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-bottom: 8px;
  }
  .lede { margin-top: 22px; font-size: 34px; line-height: 1.3; color: #cbd5e1; max-width: 960px; }
  .modules { margin-top: auto; display: flex; flex-wrap: wrap; gap: 12px; }
  .modules span {
    font-size: 22px; font-weight: 500; color: #f8fafc;
    background: #1e293b; border: 1px solid #334155; border-radius: 999px;
    padding: 8px 20px;
  }
  .modules span:first-child { border-color: #10b981; }
</style>
</head>
<body>
  <div class="eyebrow">🛡️ Open-source playbook + calculators</div>
  <h1>DIY Wealth Framework</h1>
  <p class="lede">Systems and interactive calculators for self-directed investors.</p>
  <div class="modules">
    <span>Financial Defense</span>
    <span>Cash Flow</span>
    <span>Wealth Accumulation</span>
    <span>Tax Efficiency</span>
    <span>Retirement Runway</span>
    <span>Legacy</span>
  </div>
</body>
</html>
